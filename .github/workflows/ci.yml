name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        # Runs unit tests (surefire) then integration tests (failsafe) in a single Maven session
        # so JaCoCo can collect and merge coverage from both into one report.
        # Springdoc OpenAPI generation is skipped here (handled by the dedicated job).
        run: ./mvnw -B -ntp verify -Dspringdoc.skip=true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Post coverage comment to PR
        uses: madrapps/jacoco-report@v1.6.1
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage Report
          update-comment: true
          min-coverage-overall: 70
          min-coverage-changed-files: 70

      - name: Test Summary
        uses: scacap/action-surefire-report@v1
        if: success() || failure()

  generate-openapi:
    name: Generate & Sync OpenAPI Spec
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate OpenAPI spec
        # skip unit and integration tests; spring-boot starts with the generate profile (see pom.xml)
        # jacoco.skip=true prevents the coverage check from running against empty exec data
        run: ./mvnw -B -ntp verify -DskipTests -Dspringdoc.skip=false -Djacoco.skip=true

      - name: Commit updated OpenAPI spec
        run: |
          if git diff --quiet openapi/openapi.yaml; then
            echo "OpenAPI spec is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add openapi/openapi.yaml
            git commit -m "chore: sync generated openapi.yaml [skip ci]"
            git push
          fi

  build-and-push-image:
    name: Build & Push Docker Image
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-vps:
    name: Deploy to Production
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            export DOCKER_HOST=unix:///run/user/1002/docker.sock
            cd ~/docker
            docker pull ghcr.io/ni0-name-ideas-0/chronoscope-backend-backend:latest
            docker compose up -d
            docker image prune -a -f
