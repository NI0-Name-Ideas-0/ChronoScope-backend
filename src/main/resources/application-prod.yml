cors:
  allowed-origins:
    - https://chronoscope.ni0.team

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://host.docker.internal:3306/chronoscope}
    username: ${DB_USERNAME:chronoscope}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
